# Identificador exclusivamente LOCAL usado pelo Supabase CLI para os
# containers de desenvolvimento. Ele NÃO seleciona projeto remoto e não é
# um `project-ref`. O vínculo remoto fica em `supabase/.temp/project-ref`
# depois de `supabase link`; scripts/supabase-guard.mjs valida esse arquivo
# contra o `--target` antes de executar qualquer comando com `--linked`.
project_id = "ecclesia-online-local"

[functions.bible-verses]
verify_jwt = false

[functions.daily-devotional]
verify_jwt = false

# verify-member-login-otp é chamada ANTES de existir sessão (o membro ainda
# não está autenticado — é o próprio fluxo de login por telefone) — precisa
# aceitar a anon key como Authorization, nunca um JWT de usuário já logado.
# A segurança real do endpoint está inteiramente na RPC
# _verify_member_login_otp_internal (hash, expiração, tentativa máxima,
# consumo único), nunca neste gate.
[functions.verify-member-login-otp]
verify_jwt = false

# send-chat-push recebe o JWT REAL do remetente (nunca a publishable key) —
# precisa do gateway validando o JWT antes mesmo do código da função rodar
# (defesa em profundidade, além da checagem própria em index.ts).
[functions.send-chat-push]
verify_jwt = true

# validate-tv-stream-key e update-tv-heartbeat são chamadas pela VPS MediaMTX
# (webhook), nunca pelo navegador de um usuário logado — não existe JWT de
# usuário nessa chamada. A autenticação real é o segredo compartilhado
# MEDIAMTX_WEBHOOK_SECRET, validado dentro do próprio index.ts (fail-closed
# se a variável não estiver configurada).
[functions.validate-tv-stream-key]
verify_jwt = false

[functions.update-tv-heartbeat]
verify_jwt = false

# create-livekit-room/create-livekit-token/end-livekit-room/get-r2-upload-url
# são chamadas pelo navegador com o JWT real do usuário — verify_jwt=true no
# gateway é defesa em profundidade além da checagem própria em index.ts.
[functions.create-livekit-room]
verify_jwt = true

[functions.create-livekit-token]
verify_jwt = true

[functions.end-livekit-room]
verify_jwt = true

[functions.get-r2-upload-url]
verify_jwt = true
