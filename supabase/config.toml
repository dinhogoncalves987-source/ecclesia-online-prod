# Identificador exclusivamente LOCAL usado pelo Supabase CLI para os
# containers de desenvolvimento. Ele NÃO seleciona projeto remoto e não é
# um `project-ref`. O vínculo remoto fica em `supabase/.temp/project-ref`
# depois de `supabase link`; scripts/supabase-guard.mjs valida esse arquivo
# contra o `--target` antes de executar qualquer comando com `--linked`.
project_id = "ecclesia-online-local"

[functions.bible-verses]
verify_jwt = false

[functions.daily-devotional]
verify_jwt = false

# O membro ainda não possui sessão durante a confirmação do código. A Edge
# Function valida o código pela RPC interna (hash, expiração, limite de
# tentativas e consumo único).
[functions.verify-member-login-otp]
verify_jwt = false

# send-chat-push recebe o JWT REAL do remetente (nunca a publishable key) —
# precisa do gateway validando o JWT antes mesmo do código da função rodar
# (defesa em profundidade, além da checagem própria em index.ts).
[functions.send-chat-push]
verify_jwt = true

# Webhooks da VPS MediaMTX autenticam com segredo compartilhado validado
# dentro das funções; não recebem JWT de usuário.
[functions.validate-tv-stream-key]
verify_jwt = false

[functions.update-tv-heartbeat]
verify_jwt = false

# Operações iniciadas no navegador exigem JWT real no gateway e também fazem
# validação de capability no código da função.
[functions.create-livekit-room]
verify_jwt = true

[functions.create-livekit-token]
verify_jwt = true

[functions.end-livekit-room]
verify_jwt = true

[functions.get-r2-upload-url]
verify_jwt = true

# Importações com IA podem conter dados pessoais e financeiros. O gateway
# legado fica desligado; a função exige e reconfirma o access token atual com
# supabase.auth.getUser(jwt), compatível com as chaves JWT novas.
[functions.ai-import]
verify_jwt = false
